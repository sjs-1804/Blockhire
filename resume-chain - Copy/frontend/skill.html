<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skill Verification Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
  <script src="skill.js" defer></script> <!-- Connect to skill module functions -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-yellow-50 via-orange-50 to-red-50 min-h-screen">

  <div class="container mx-auto py-10">
    <h1 class="text-4xl font-bold text-center text-red-600 mb-10">Skill Verification Portal</h1>

    <!-- Go Back -->
    <div class="text-center mb-8">
      <a href="index.html" class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-2 rounded">Go Back to Home</a>
    </div>

    <!-- University: Post Online/Offline Skill Test -->
    <div class="bg-white shadow-lg rounded-lg p-6 mb-6">
      <h2 class="text-2xl font-semibold mb-4">Post Skill Test (University)</h2>
      <input type="text" id="skillName" placeholder="Skill Name" class="border rounded px-3 py-2 w-full mb-3">
      <textarea id="questions" placeholder='Questions JSON, e.g. ["Q1","Q2"]' class="border rounded px-3 py-2 w-full mb-3"></textarea>
      <textarea id="options" placeholder='Options JSON, e.g. [["A","B"],["C","D"]]' class="border rounded px-3 py-2 w-full mb-3"></textarea>
      <textarea id="correctOptions" placeholder='Correct options JSON, e.g. [0,1]' class="border rounded px-3 py-2 w-full mb-3"></textarea>
      <select id="mode" class="border rounded px-3 py-2 w-full mb-3">
        <option value="0">ONLINE</option>
        <option value="1">OFFLINE</option>
      </select>
      <input type="datetime-local" id="startTime" class="border rounded px-3 py-2 w-full mb-3">
      <input type="datetime-local" id="endTime" class="border rounded px-3 py-2 w-full mb-3">
      <button onclick="postSkillTest()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded">Post Test</button>
    </div>

    <!-- Applicant: Attempt Online Test -->
    <div class="bg-white shadow-lg rounded-lg p-6 mb-6">
      <h2 class="text-2xl font-semibold mb-4">Attempt Online Test (Applicant)</h2>
      <input type="number" id="testIndex" placeholder="Test Index" class="border rounded px-3 py-2 w-full mb-3">
      <textarea id="answers" placeholder='Answers JSON, e.g. [0,1,2]' class="border rounded px-3 py-2 w-full mb-3"></textarea>
      <button onclick="submitOnlineTest()" class="bg-orange-600 hover:bg-orange-700 text-white px-5 py-2 rounded">Submit Test</button>
    </div>

    <!-- University: Assign Offline Score -->
    <div class="bg-white shadow-lg rounded-lg p-6 mb-6">
      <h2 class="text-2xl font-semibold mb-4">Assign Offline Score (University)</h2>
      <input type="text" id="studentAddress" placeholder="Student Address" class="border rounded px-3 py-2 w-full mb-3">
      <input type="number" id="offlineTestIndex" placeholder="Test Index" class="border rounded px-3 py-2 w-full mb-3">
      <input type="number" id="offlineScore" placeholder="Score" class="border rounded px-3 py-2 w-full mb-3">
      <input type="text" id="batch" placeholder="Batch" class="border rounded px-3 py-2 w-full mb-3">
      <button onclick="assignOfflineScore()" class="bg-yellow-600 hover:bg-yellow-700 text-white px-5 py-2 rounded">Assign Score</button>
    </div>

    <!-- Applicant: View Skills & Batches -->
    <div class="bg-white shadow-lg rounded-lg p-6 mb-6">
      <h2 class="text-2xl font-semibold mb-4">View Verified Skills & Batches</h2>
      <input type="text" id="studentAddr" placeholder="Your Address" class="border rounded px-3 py-2 w-full mb-3">
      <button onclick="viewSkills()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded">View Skills</button>
    </div>

    <!-- Employer: View Student Skills -->
    <div class="bg-white shadow-lg rounded-lg p-6 mb-6">
      <h2 class="text-2xl font-semibold mb-4">View Student Skills (Employer)</h2>
      <input type="text" id="studentAddress" placeholder="Student Address" class="border rounded px-3 py-2 w-full mb-3">
      <button onclick="viewStudentSkills()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded">View Skills</button>
    </div>

  </div>
</body>
</html>
