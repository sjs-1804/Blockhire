<main class="container mx-auto mt-10 px-4 max-w-5xl">
  <!-- University Registration -->

    <h2 class="text-2xl font-semibold text-blue-700 mb-4">Register Your University</h2>
    <form id="universityForm" class="space-y-4">
      <input type="text" id="uniName" placeholder="University Name" class="w-full p-3 border rounded-lg" required>
      <input type="url" id="uniWebsite" placeholder="Website URL" class="w-full p-3 border rounded-lg" required>
      <input type="text" id="uniAddress" placeholder="Physical Address" class="w-full p-3 border rounded-lg" required>
      <input type="email" id="uniEmail" placeholder="Official Email" class="w-full p-3 border rounded-lg" required>
      <input type="text" id="uniRegNo" placeholder="Government Registration Number" class="w-full p-3 border rounded-lg" required>
      <input type="text" id="uniAccreditation" placeholder="Accreditation ID" class="w-full p-3 border rounded-lg">
      <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">Register University</button>
    </form>
    <p id="registrationStatus" class="mt-4 text-green-600 font-medium"></p>
  </section>

  <!-- Student Addition -->
  <section id="studentSection" class="hidden bg-white shadow-lg rounded-xl p-6">
    <h2 class="text-2xl font-semibold text-blue-700 mb-4">Add Student</h2>

      <input type="text" id="studentName" placeholder="Full Name" class="w-full p-3 border rounded-lg" required>
      <input type="email" id="studentEmail" placeholder="Email ID" class="w-full p-3 border rounded-lg" required>
      <input type="text" id="studentDegree" placeholder="Degree" class="w-full p-3 border rounded-lg" required>
      <input type="text" id="studentRegNo" placeholder="Registration Number" class="w-full p-3 border rounded-lg" required>
      <input type="number" id="yearCompletion" placeholder="Year of Completion" class="w-full p-3 border rounded-lg" required>
      <input type="file" id="studentPhoto" accept="image/*" class="w-full p-3 border rounded-lg" required>
      <input type="file" id="studentResume" accept=".pdf,.doc,.docx" class="w-full p-3 border rounded-lg" required>
      <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition">Add Student</button>
    </form>
    <p id="studentStatus" class="mt-4 text-green-600 font-medium"></p>

    <h3 class="text-xl font-semibold text-blue-700 mt-6 mb-3">Students Added</h3>

</main>

// ===== SHA-256 Utility Function =====
async function computeSHA256Hex(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
}

// ===== INIT =====
async function init() {
  if (!window.ethereum) return alert("Please install MetaMask");
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();

  universityContract = new ethers.Contract(universityAddress, universityABI, signer);
  universityRegistryContract = new ethers.Contract(universityRegistryAddress, universityRegistryABI, signer);
  resumeRegistryContract = new ethers.Contract(resumeRegistryAddress, resumeRegistryABI, signer);
}

// ===== IPFS Upload via Lighthouse =====
async function uploadToLighthouse(file) {
  const apiKey = "265b44d3.4545619d6942437aba07485069df6f63";
  const formData = new FormData();
  formData.append("file", file);
  const res = await fetch("https://node.lighthouse.storage/api/v0/add", {
    method: "POST",
    headers: { "Authorization": `Bearer ${apiKey}` },
    body: formData
  });
  const data = await res.json();
  return data.Hash;
}

// ===== REGISTER UNIVERSITY =====
document.getElementById("universityForm").onsubmit = async e => {
  e.preventDefault();
  const name = document.getElementById("uniName").value;
  const website = document.getElementById("uniWebsite").value;
  const address = document.getElementById("uniAddress").value;
  const email = document.getElementById("uniEmail").value;
  const regNo = document.getElementById("uniRegNo").value;
  const accreditation = document.getElementById("uniAccreditation").value;

  try {
    const tx = await universityContract.registerUniversity(name, website, address, email, regNo, accreditation);
    await tx.wait();
    document.getElementById("registrationStatus").textContent = "University registered & approved ✅";
    document.getElementById("studentSection").classList.remove("hidden");
  } catch(err) {
    console.error(err); alert("Registration failed");
  }
};

// ===== ADD STUDENT =====
document.getElementById("studentForm").onsubmit = async e => {
  e.preventDefault();

  const photoFile = document.getElementById("studentPhoto").files[0];
  const resumeFile = document.getElementById("studentResume").files[0];
  if(!photoFile || !resumeFile) return alert("Upload photo and resume");

  const photoCID = await uploadToLighthouse(photoFile);
  const resumeCID = await uploadToLighthouse(resumeFile);

  const name = document.getElementById("studentName").value;
  const email = document.getElementById("studentEmail").value;
  const degree = document.getElementById("studentDegree").value;
  const regNo = document.getElementById("studentRegNo").value;
  const completion = parseInt(document.getElementById("yearCompletion").value);

  try {
    // ----- Cross-verify with UniversityRegistry -----
    const studentsFromRegistry = await universityRegistryContract.getStudents(await signer.getAddress());
    const { names, emails, degrees, regNos, yearsCompletion } = studentsFromRegistry;
    let verified = false;
    for(let i=0;i<names.length;i++){
      if(names[i]===name && emails[i]===email && degrees[i]===degree && regNos[i]===regNo && yearsCompletion[i]===completion){
        verified = true; break;
      }
    }
    if(!verified) return alert("Student details do not match UniversityRegistry records");

    // ----- Compute SHA-256 Hash of verified attributes + photoCID + resumeCID -----
    const combinedString = `${name}|${email}|${degree}|${regNo}|${completion}|${photoCID}|${resumeCID}`;
    const hashHex = await computeSHA256Hex(combinedString);

    // ----- Send to ResumeRegistry -----
    const tx = await resumeRegistryContract.registerStudent(
      name,
      "Your University Name",
      email,
      "", // skill
      resumeCID,
      photoCID,
      degree,
      regNo,
      completion,
      hashHex
    );
    await tx.wait();

    allStudents.push({name,email,degree,regNo,completion,photo:photoCID,resume:resumeCID,hash:hashHex});
    document.getElementById("studentStatus").textContent = "Student added ✅";
    document.getElementById("studentForm").reset();
    renderStudents(allStudents);

  } catch(err) { console.error(err); alert("Failed to add student"); }
};

// ===== RENDER STUDENTS =====
function renderStudents(students) {
  const list = document.getElementById("studentList");
  list.innerHTML = "";
  students.forEach(s => {
    const div = document.createElement("div");
    div.className = "bg-blue-50 p-4 rounded-lg flex items-center gap-4";
    div.innerHTML = `
      <img src="https://ipfs.io/ipfs/${s.photo}" class="w-20 h-20 rounded-full border object-cover">
      <div>
        <strong>${s.name}</strong><br>
        Degree: ${s.degree}<br>
        RegNo: ${s.regNo}<br>
        Year: ${s.completion}<br>
        Photo CID: <span class="text-xs break-all">${s.photo}</span><br>
        Resume CID: <span class="text-xs break-all">${s.resume}</span><br>
        SHA-256 Hash: <span class="text-xs break-all">${s.hash}</span>
      </div>
    `;
    list.appendChild(div);
  });
}

window.onload = init;
</script>
