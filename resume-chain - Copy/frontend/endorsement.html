<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Endorsement Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
    <script src="js/endorsement.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-green-50 via-green-100 to-white min-h-screen font-sans">

    <div class="container mx-auto py-10">
        <h1 class="text-4xl font-bold text-center text-green-700 mb-10">Endorsement Portal</h1>

        <!-- Connect Wallet -->
        <div class="text-center mb-6">
            <button id="connectButton" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded">Connect Wallet</button>
        </div>

        <!-- Endorsement Form -->
        <div class="bg-white shadow-lg rounded-lg p-6 mb-6 max-w-lg mx-auto">
            <h2 class="text-2xl font-semibold mb-4">Submit Endorsement</h2>
            <input type="text" id="resumeID" placeholder="Resume ID" class="border rounded px-3 py-2 w-full mb-3">
            <input type="text" id="endorser" placeholder="Endorser Name" class="border rounded px-3 py-2 w-full mb-3">
            <input type="text" id="skill" placeholder="Skill Name" class="border rounded px-3 py-2 w-full mb-3">
            <button id="submitButton" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded w-full">Submit Endorsement</button>
            <button id="retrieveButton" class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-2 rounded w-full mt-3">Retrieve Endorsement</button>
        </div>

        <div id="endorsementResult" class="text-center text-green-600 font-medium mt-4"></div>
    </div>

</body>
</html>
