<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Test Portal</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen">

<!-- Header -->
<header class="bg-blue-600 text-white py-6 shadow-md">
    <div class="container mx-auto text-center">
        <h1 class="text-3xl font-bold">📝 Skill Test Portal</h1>
        <p class="mt-2 text-lg">Answer the questions and submit before the timer ends.</p>
        <div class="mt-4">
            <a href="applicant.html" class="inline-block bg-gray-700 text-white px-4 py-2 rounded hover:bg-gray-800">
                ⬅️ Back to Student Portal
            </a>
        </div>
    </div>
</header>

<main class="container mx-auto mt-8 px-4 max-w-3xl">
    <!-- Timer -->
    <div class="bg-white p-4 rounded-xl shadow mb-6 flex justify-between items-center">
        <span class="font-semibold text-gray-700">Time Remaining:</span>
        <span id="timer" class="text-red-600 font-bold text-lg">30:00</span>
    </div>

    <!-- Test Questions -->
    <form id="testForm" class="bg-white p-6 rounded-xl shadow space-y-6">
        <h2 class="text-xl font-bold mb-4">Test: JavaScript Fundamentals</h2>

        <div class="space-y-2">
            <label class="block font-semibold">1. What is a closure in JavaScript?</label>
            <textarea class="border p-2 w-full rounded" name="q1" rows="2" required></textarea>
        </div>

        <div class="space-y-2">
            <label class="block font-semibold">2. Explain event bubbling in JavaScript.</label>
            <textarea class="border p-2 w-full rounded" name="q2" rows="2" required></textarea>
        </div>

        <div class="space-y-2">
            <label class="block font-semibold">3. What is the difference between `==` and `===`?</label>
            <textarea class="border p-2 w-full rounded" name="q3" rows="2" required></textarea>
        </div>

        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Submit Test</button>
    </form>

    <!-- Submission Status -->
    <div id="submissionStatus" class="mt-6 text-center text-green-600 font-semibold"></div>
</main>

<script>
// ---------- Timer ----------
let totalSeconds = 30 * 60; // 30 minutes
const timerEl = document.getElementById('timer');

function updateTimer() {
    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;
    timerEl.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    if(totalSeconds <= 0) {
        submitTest();
    }
    totalSeconds--;
}

const timerInterval = setInterval(updateTimer, 1000);

// ---------- Form Submission ----------
document.getElementById('testForm').onsubmit = function(e) {
    e.preventDefault();
    submitTest();
};

function submitTest() {
    clearInterval(timerInterval);
    const form = document.getElementById('testForm');
    const answers = {};
    new FormData(form).forEach((value, key) => answers[key] = value);

    console.log("Test Submitted:", answers);

    // Demo: Show submission success
    document.getElementById('submissionStatus').textContent = "✅ Test submitted successfully!";
    form.style.display = 'none';

    // TODO: Connect to blockchain to save answers and mark results
}
</script>

</body>
</html>
