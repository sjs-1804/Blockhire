<div class="min-h-screen p-6 flex flex-col items-center">
  <div class="w-full max-w-4xl">
    <header class="bg-white rounded-lg shadow p-6 mb-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold">Applicant Portal — Live Test</h1>
      <div>
        <button id="connectWalletBtn" class="bg-green-600 text-white px-4 py-2 rounded mr-2">Connect Wallet</button>
        <button id="disconnectBtn" class="bg-red-500 text-white px-4 py-2 rounded hidden">Disconnect</button>
        <div id="walletAddress" class="mt-2 text-sm break-all"></div>
      </div>
    </header>

    <!-- Student verification & resume upload (kept from prior portal) -->
    <section class="grid grid-cols-1 gap-6 mb-6">
      <div class="bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-3">1️⃣ Student Verification</h2>
        <form id="verifyForm" class="space-y-2">
          <input id="studentName" class="w-full border p-2 rounded" placeholder="Full name" required />
          <input id="studentEmail" class="w-full border p-2 rounded" placeholder="Email" required />
          <input id="studentDegree" class="w-full border p-2 rounded" placeholder="Degree" required />
          <div class="flex gap-2">
            <input id="studentRegNo" class="flex-1 border p-2 rounded" placeholder="Registration number" required />
            <input id="studentYear" type="number" class="w-28 border p-2 rounded" placeholder="Year" required />
          </div>
          <button class="bg-blue-600 text-white px-4 py-2 rounded" type="submit">Verify & Register</button>
        </form>
        <p id="verificationStatus" class="mt-2 font-semibold"></p>
      </div>

      <div class="bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-3">2️⃣ Resume Upload</h2>
        <input id="resumeFile" type="file" accept=".pdf,.doc,.docx,.txt" class="mb-2" />
        <div class="flex gap-2">
          <button id="uploadResumeBtn" class="bg-purple-600 text-white px-4 py-2 rounded">Upload & Store on IPFS</button>
          <button id="viewResumeBtn" class="bg-gray-200 px-4 py-2 rounded">View Last CID</button>
        </div>
        <p id="resumeStatus" class="mt-2 font-semibold"></p>
        <p id="lastResumeCID" class="mt-1 text-sm text-gray-600 break-all"></p>
      </div>
    </section>

    <!-- Notifications & tests -->
    <section class="bg-white p-4 rounded shadow mb-6">
      <h2 class="font-semibold mb-3">3️⃣ Notifications & Tests</h2>
      <div id="notifications" class="space-y-3"></div>
    </section>

    <section class="bg-white p-4 rounded shadow">
      <h2 class="font-semibold mb-3">4️⃣ Result Notifications</h2>
      <div id="resultNotifications" class="space-y-2"></div>
    </section>
  </div>
</div>

<!-- Test Modal -->
<div id="testModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white rounded-xl w-[90%] max-w-3xl p-6 relative">
    <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-600">✖</button>
    <h2 id="modalTitle" class="text-2xl font-bold mb-2"></h2>
    <div id="modalMeta" class="text-sm text-gray-600 mb-4"></div>
    <div id="timer" class="text-red-600 font-semibold mb-4 text-right"></div>

    <form id="testForm" class="space-y-4 max-h-[60vh] overflow-auto"></form>

    <div class="flex gap-2 mt-4">
      <button id="submitTestBtn" class="bg-green-600 text-white px-4 py-2 rounded">Submit Test</button>
      <button onclick="saveAndClose(event)" class="bg-gray-200 px-4 py-2 rounded">Save & Exit (pause not allowed)</button>
    </div>

    <p id="modalStatus" class="mt-3 font-semibold"></p>
  </div>
</div>

// Compute SHA-256 hash of a string and return as hex
async function computeSHA256Hex(inputStr) {
    const encoder = new TextEncoder();
    const data = encoder.encode(inputStr);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2,'0'))
        .join('');
}

// ======= Web3 and wallet handling =======
async function connectWallet() {
  try {
    if (!window.ethereum) throw new Error("MetaMask not found");
    web3 = new Web3(window.ethereum);
    accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    if (!accounts || accounts.length === 0) throw new Error("No accounts found");
    account = accounts[0];
    walletAddressEl.innerText = account;
    connectBtn.classList.add('hidden');
    disconnectBtn.classList.remove('hidden');
    connected = true;

    // instantiate contracts defensively
    try { resumeRegistry = new web3.eth.Contract(resumeRegistryABI, resumeRegistryAddress); }
    catch (e) { console.warn("resumeRegistry instantiation failed:", e); resumeRegistry = null; }

    try { universityRegistry = new web3.eth.Contract(universityRegistryABI, universityRegistryAddress); }
    catch (e) { universityRegistry = null; }

    // load notifications now that we have account
    loadNotifications();
  } catch (err) {
    alert("Wallet connect failed: " + (err.message || err));
    console.error(err);
  }
}

function disconnectWallet() {
  accounts = [];
  account = null;
  walletAddressEl.innerText = '';
  connected = false;
  connectBtn.classList.remove('hidden');
  disconnectBtn.classList.add('hidden');
  notificationsEl.innerHTML = '<div class="text-sm text-gray-600">Connect to see notifications</div>';
}

// track account changes
if (window.ethereum) {
  window.ethereum.on('accountsChanged', (accs) => {
    if (!accs || accs.length === 0) disconnectWallet();
    else { accounts = accs; account = accs[0]; walletAddressEl.innerText = account; loadNotifications(); }
  });
}

connectBtn.onclick = connectWallet;
disconnectBtn.onclick = disconnectWallet;

// ======= Notifications & "Take Test" buttons =======
// This will read scheduled tests from the contract in production.
// For now we use mockTests and display a "Take Test" button that unlocks at scheduled time.
async function loadNotifications() {
  notificationsEl.innerHTML = '';

  // In production: fetch tests for this student via contract call, e.g. resumeRegistry.methods.getStudentTestsByAddress(account).call()
  // Here we use mock data:
  for (const t of mockTests) {
    const startTime = new Date(t.startTimeISO);
    const now = new Date();
    const canTake = now >= startTime;
    const container = document.createElement('div');
    container.className = "p-3 rounded border flex justify-between items-center";

    const left = document.createElement('div');
    left.innerHTML = `<div class="font-semibold">${t.title}</div><div class="text-sm text-gray-600">Scheduled: ${startTime.toLocaleString()}</div>`;

    const right = document.createElement('div');
    const btn = document.createElement('button');
    btn.className = `px-3 py-2 rounded ${canTake ? 'bg-blue-600 text-white' : 'bg-gray-300 text-gray-600'}`;
    btn.disabled = !canTake;
    btn.innerText = canTake ? 'Take Test' : 'Locked';
    btn.onclick = () => openTestModal(t);
    right.appendChild(btn);

    container.appendChild(left);
    container.appendChild(right);
    notificationsEl.appendChild(container);
  }
}

// ======= Test modal: build UI, start timer =======
function openTestModal(testObj) {
  currentTest = testObj;
  modalTitle.innerText = testObj.title;
  modalMeta.innerText = testObj.description || '';
  testForm.innerHTML = '';
  modalStatus.innerText = '';

  // Build questions
  testObj.questions.forEach((q, idx) => {
    const qWrap = document.createElement('div');
    qWrap.className = 'p-3 border rounded';

    const qTitle = document.createElement('div');
    qTitle.className = 'font-semibold mb-2';
    qTitle.innerText = `${idx+1}. ${q.q}`;
    qWrap.appendChild(qTitle);

    if (q.type === 'mcq') {
      q.options.forEach((opt, oidx) => {
        const label = document.createElement('label');
        label.className = 'block';
        label.innerHTML = `<input type="radio" name="${q.qid}" value="${oidx}" class="mr-2"> ${opt}`;
        qWrap.appendChild(label);
      });
    } else if (q.type === 'desc') {
      const ta = document.createElement('textarea');
      ta.name = q.qid;
      ta.rows = 4;
      ta.className = 'w-full border rounded p-2';
      qWrap.appendChild(ta);
    }

    // Hidden correctIndex if present (used for browser auto-scoring)
    if (typeof q.correctIndex !== 'undefined') {
      const hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = `${q.qid}__correct`;
      hidden.value = String(q.correctIndex);
      qWrap.appendChild(hidden);
    }

    testForm.appendChild(qWrap);
  });

  // Start timer
  remainingSeconds = testObj.durationSeconds;
  updateTimer();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateTimer();
    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      modalStatus.innerText = "Time is up — auto-submitting.";
      submitTest(); // auto-submit
    }
  }, 1000);

  testModal.classList.remove('hidden');
}

function updateTimer() {
  const m = Math.floor(remainingSeconds / 60);
  const s = remainingSeconds % 60;
  timerEl.innerText = `⏱️ Time left: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// Close / abort modal
function closeModal() {
  testModal.classList.add('hidden');
  modalStatus.innerText = '';
  if (timerInterval) clearInterval(timerInterval);
  currentTest = null;
}

// Save & Exit (we will not allow pause but allow to close and still have answers retained client-side)
function saveAndClose(e) {
  e.preventDefault();
  // Let user close; answers are retained until page refresh
  closeModal();
  alert("Progress saved locally in this session. Note: pause/resume must be supported by contract for reliable results.");
}

// ======= Submission flow (MCQ auto-score + descriptive upload) =======
submitTestBtn.onclick = submitTest;

async function submitTest() {
  if (!currentTest) return;
  modalStatus.innerText = "Preparing submission...";
  // Collect answers
  const formElems = testForm.elements;
  const mcqAnswers = [];   // numeric answers for MCQs in order
  const descAnswers = {};  // map qid -> text for descriptive

  currentTest.questions.forEach((q, idx) => {
    if (q.type === 'mcq') {
      const radios = formElems[q.qid];
      let val = null;
      if (!radios) { mcqAnswers.push(-1); return; }
      if (radios.length === undefined) { // single input edge
        val = radios.checked ? radios.value : null;
      } else {
        for (const r of radios) { if (r.checked) { val = r.value; break; } }
      }
      mcqAnswers.push(val !== null ? parseInt(val) : -1);
    } else if (q.type === 'desc') {
      const ta = formElems[q.qid];
      descAnswers[q.qid] = ta ? ta.value.trim() : "";
    }
  });

  // Auto-score MCQs in-browser (compare against correctIndex if available)
  let mcqScore = null;
  try {
    let correctCount = 0;
    let totalMcq = 0;
    currentTest.questions.forEach((q, idx) => {
      if (q.type === 'mcq') {
        totalMcq++;
        if (typeof q.correctIndex !== 'undefined') {
          if (mcqAnswers[idx] === q.correctIndex) correctCount++;
        }
      }
    });
    if (totalMcq > 0) {
      // If any MCQ had 'correctIndex' present we can compute score; else score = null (pending)
      const hasAnswerKey = currentTest.questions.some(q => q.type==='mcq' && typeof q.correctIndex !== 'undefined');
      if (hasAnswerKey) {
        mcqScore = Math.round((correctCount / totalMcq) * 100); // percentage
      }
    }
  } catch (e) {
    console.warn("Auto-scoring issue:", e);
  }

  modalStatus.innerText = "Uploading descriptive answers to IPFS (if any)...";

  // Upload descriptive answers to IPFS as a single JSON blob if any descriptive answers exist
  let descCID = "";
  try {
    const descEntries = Object.entries(descAnswers).filter(([,v]) => v && v.length > 0);
    if (descEntries.length > 0) {
      const payload = {};
      descEntries.forEach(([k,v]) => payload[k] = v);
      const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
      const form = new FormData();
      form.append("file", blob, `descriptive_${currentTest.testId}_${Date.now()}.json`);

      const res = await fetch("https://api.lighthouse.storage/upload", {
        method: "POST",
        headers: { "Authorization": LIGHTHOUSE_API_KEY },
        body: form
      });
      const data = await res.json();
      if (data && data.Hash) {
        descCID = data.Hash;
        modalStatus.innerText = "Descriptive answers uploaded (CID: " + descCID + "). Preparing on-chain submission...";
      } else {
        console.warn("IPFS response no Hash:", data);
        modalStatus.innerText = "IPFS upload didn't return CID (see console). We'll still attempt on-chain tx for MCQs.";
      }
    } else {
      modalStatus.innerText = "No descriptive answers to upload. Preparing on-chain submission...";
    }
  } catch (err) {
    console.error("Descriptive upload error:", err);
    modalStatus.innerText = "IPFS upload failed (see console). We'll still attempt on-chain tx for MCQs.";
  }

  // 1) Submit MCQ answers on-chain via submitTestByStudent(testId, testIndex, answers)
  //    Adjust arguments if your contract uses different param order/names.
  let txReceipt = null;
  if (!resumeRegistry) {
    modalStatus.innerText = "Contract not instantiated — cannot send on-chain tx.";
  } else {
    try {
      // convert mcqAnswers to uint array - replace negative values (-1) with e.g. 255 sentinel if needed by your contract
      const answersForChain = mcqAnswers.map(a => (a === -1 ? 255 : a)); // 255 used as 'no answer' sentinel
      modalStatus.innerText = "Sending answers (MCQ) on-chain...";
      txReceipt = await resumeRegistry.methods.submitTestByStudent(
        currentTest.testId,
        currentTest.testId, // second index param — keep same or adapt
        answersForChain
      ).send({ from: account });
      modalStatus.innerText = "MCQ answers sent on-chain (tx mined).";
      console.log("submitTest txReceipt:", txReceipt);
    } catch (err) {
      console.error("submitTestByStudent error:", err);
      modalStatus.innerText = "On-chain MCQ submission failed (see console).";
    }
  }

  // 2) If descCID exists, try to call optional contract method submitDescriptiveAnswers(testId, cid)
  if (descCID && resumeRegistry) {
    try {
      if (typeof resumeRegistry.methods.submitDescriptiveAnswers === "function") {
        modalStatus.innerText = "Sending descriptive CID to contract for manual evaluation...";
        await resumeRegistry.methods.submitDescriptiveAnswers(currentTest.testId, descCID).send({ from: account });
        modalStatus.innerText = "Descriptive CID stored on-chain for manual evaluation.";
      } else {
        // method doesn't exist — warn but keep CID displayed
        console.warn("Contract has no submitDescriptiveAnswers method.");
        modalStatus.innerText += " (Contract has no submitDescriptiveAnswers method; CID available below.)";
      }
    } catch (err) {
      console.error("submitDescriptiveAnswers error:", err);
      modalStatus.innerText += " (Failed to send CID to contract — see console.)";
    }
  }

  // 3) Store local result notification / push to UI
  const resultMsgParts = [];
  if (mcqScore !== null) resultMsgParts.push(`MCQ Score: ${mcqScore}%`);
  else resultMsgParts.push(`MCQ: submitted (score pending)`);

  if (descCID) resultMsgParts.push(`Descriptive CID: ${descCID}`);

  addResultNotification(currentTest.testId, resultMsgParts.join(" | "));

  // clear modal & timer
  if (timerInterval) clearInterval(timerInterval);
  testModal.classList.add('hidden');
  modalStatus.innerText = "Submission complete.";
  // Refresh on-page notifications (if any)
  loadNotifications();
}

// Helper to render a result notification
function addResultNotification(testId, message) {
  const div = document.createElement('div');
  div.className = 'p-3 rounded border';
  div.innerHTML = `<strong>Test ${testId}:</strong> ${message} <span class="text-xs text-gray-600 ml-2">(${new Date().toLocaleString()})</span>`;
  resultNotificationsEl.prepend(div);
}

// ======= Load initial state =======
window.addEventListener('load', async () => {
  // Show placeholder until wallet connected
  notificationsEl.innerHTML = '<div class="text-sm text-gray-600">Connect wallet to load tests & notifications</div>';

  // Attempt auto-connect if wallet already granted
  if (window.ethereum && window.ethereum.selectedAddress) {
    await connectWallet();
  } else {
    // still render notifications (mock) so UI shows test list
    loadNotifications();
  }
});

// ======= Utility: loadNotifications uses mockTests for now =======
function loadNotifications() {
  notificationsEl.innerHTML = '';
  // In production, fetch tests for 'account' from contract and map them into same structure
  for (const t of mockTests) {
    const div = document.createElement('div');
    div.className = 'p-3 rounded border flex justify-between items-center';
    const left = document.createElement('div');
    left.innerHTML = `<div class="font-semibold">${t.title}</div><div class="text-sm text-gray-600">${new Date(t.startTimeISO).toLocaleString()}</div>`;
    const right = document.createElement('div');
    const now = new Date();
    const start = new Date(t.startTimeISO);
    const btn = document.createElement('button');
    btn.innerText = now >= start ? 'Take Test' : 'Locked';
    btn.disabled = now < start;
    btn.className = now >= start ? 'bg-blue-600 text-white px-3 py-2 rounded' : 'bg-gray-300 text-gray-600 px-3 py-2 rounded';
    btn.onclick = () => openTestModal(t);
    right.appendChild(btn);
    div.appendChild(left);
    div.appendChild(right);
    notificationsEl.appendChild(div);
  }
}
</script>
