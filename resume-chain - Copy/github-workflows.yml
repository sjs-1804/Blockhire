name: CI/CD Pipeline for Resume Verification System

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  CACHE_VERSION: 'v1'

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint --if-present

    - name: Run Prettier check
      run: npm run format --check --if-present

    - name: Run Solidity linter
      run: npm run lint:sol --if-present || echo "Solhint not configured"

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Slither static analysis
      run: |
        pip install slither-analyzer
        slither contracts/ --json slither-results.json --filter-paths "node_modules/" || true
        echo "Slither analysis completed"

    - name: Upload Slither results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: slither-results
        path: slither-results.json

    - name: Run npm audit
      run: npm audit --audit-level=moderate

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:unit --if-present || npx hardhat test test/unit/

    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: |
          test-results/
          coverage/

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run integration tests
      run: npm run test:integration --if-present || npx hardhat test test/integration/

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: test-results/

  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run E2E tests
      run: npm run test:e2e --if-present || npx hardhat test test/e2e/

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: test-results/

  test-security:
    name: Security Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security tests
      run: npm run test:security --if-present || npx hardhat test test/security/

    - name: Upload security test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-test-results
        path: test-results/

  test-performance:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run performance tests
      run: npm run test:performance --if-present || npx hardhat test test/performance/

    - name: Upload performance test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: test-results/

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run test coverage
      run: npm run test:coverage --if-present || echo "Coverage not configured"

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: coverage/

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npx hardhat compile

    - name: Run all tests
      run: npm test

    - name: Generate gas report
      run: REPORT_GAS=true npx hardhat test || echo "Gas report generated"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          artifacts/
          cache/
          typechain-types/

  deploy-local:
    name: Deploy to Local Testnet
    runs-on: ubuntu-latest
    needs: [build-and-test, test-unit, test-integration]
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Start local Hardhat network
      run: |
        npx hardhat node > /tmp/hardhat.log 2>&1 &
        sleep 5

    - name: Deploy contracts locally
      run: npm run deploy:local
      env:
        HARDHAT_NETWORK: localhost

    - name: Run deployment verification
      run: npm run verify:contracts --if-present

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: local-deployment
        path: |
          deployments/
          deployment-addresses.json

  deploy-testnet:
    name: Deploy to Sepolia Testnet
    runs-on: ubuntu-latest
    needs: [build-and-test, test-unit, test-integration, test-e2e]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Deploy to Sepolia testnet
      run: npm run deploy:sepolia
      env:
        SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

    - name: Verify contracts on Etherscan
      run: npm run verify:contracts
      env:
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

    - name: Upload testnet deployment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sepolia-deployment
        path: |
          deployments/
          deployment-addresses.json

  monitor-health:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-testnet]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run health checks
      run: npm run monitor
      env:
        NETWORK_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        CONTRACT_ADDRESSES: ${{ secrets.CONTRACT_ADDRESSES }}

    - name: Upload health check results
      uses: actions/upload-artifact@v4
      with:
        name: health-check-results
        path: health-check-results.json

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-e2e, test-security, test-performance]
    if: always()

    steps:
    - name: Notify success
      if: ${{ needs.test-unit.result == 'success' && needs.test-integration.result == 'success' && needs.test-e2e.result == 'success' && needs.test-security.result == 'success' && needs.test-performance.result == 'success' }}
      run: |
        echo "✅ All tests passed successfully!"
        echo "📊 Test Results:"
        echo "  - Unit Tests: ${{ needs.test-unit.result }}"
        echo "  - Integration Tests: ${{ needs.test-integration.result }}"
        echo "  - E2E Tests: ${{ needs.test-e2e.result }}"
        echo "  - Security Tests: ${{ needs.test-security.result }}"
        echo "  - Performance Tests: ${{ needs.test-performance.result }}"

    - name: Notify failures
      if: ${{ needs.test-unit.result == 'failure' || needs.test-integration.result == 'failure' || needs.test-e2e.result == 'failure' || needs.test-security.result == 'failure' || needs.test-performance.result == 'failure' }}
      run: |
        echo "❌ Some tests failed!"
        echo "📊 Test Results:"
        echo "  - Unit Tests: ${{ needs.test-unit.result }}"
        echo "  - Integration Tests: ${{ needs.test-integration.result }}"
        echo "  - E2E Tests: ${{ needs.test-e2e.result }}"
        echo "  - Security Tests: ${{ needs.test-security.result }}"
        echo "  - Performance Tests: ${{ needs.test-performance.result }}"
        exit 1